<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff6c8">

  <title>九九れんしゅう</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

  <!-- ==============================
       スタート画面
  ============================== -->

  <section id="start-screen" class="screen active">

    <div class="title-icon">🌟</div>

    <h1>九九れんしゅう</h1>

    <p class="subtitle">
      れんしゅうする「だん」を えらぼう！
    </p>


    <div class="dan-buttons">

      <button class="dan-button" data-dan="2">
        2のだん
      </button>

      <button class="dan-button" data-dan="3">
        3のだん
      </button>

      <button class="dan-button" data-dan="4">
        4のだん
      </button>

      <button class="dan-button" data-dan="5">
        5のだん
      </button>

      <button class="dan-button" data-dan="6">
        6のだん
      </button>

      <button class="dan-button" data-dan="7">
        7のだん
      </button>

      <button class="dan-button" data-dan="8">
        8のだん
      </button>

      <button class="dan-button" data-dan="9">
        9のだん
      </button>

    </div>


    <div class="special-buttons">

      <button id="mix-button" class="menu-button mix">
        🔀 ごちゃまぜ
      </button>

      <button id="weak-button" class="menu-button weak">
        🔥 にがてもんだい
      </button>

      <button id="stats-button" class="menu-button stats">
        📊 がくしゅうきろく
      </button>

    </div>

  </section>


  <!-- ==============================
       出題方法選択
  ============================== -->

  <section id="mode-screen" class="screen">

    <button id="mode-back-button" class="back-button">
      ← もどる
    </button>

    <div class="mode-card">

      <div class="mode-icon">✏️</div>

      <h2 id="mode-title">
        7のだん
      </h2>

      <p class="mode-description">
        どっちで れんしゅうする？
      </p>


      <button id="order-button" class="mode-button order">

        <span class="mode-button-icon">🔢</span>

        <span>
          <strong>じゅんばん</strong>
          <small>1から9まで じゅんばんに</small>
        </span>

      </button>


      <button id="random-button" class="mode-button random">

        <span class="mode-button-icon">🎲</span>

        <span>
          <strong>ランダム</strong>
          <small>バラバラに 10もん！</small>
        </span>

      </button>

    </div>

  </section>


  <!-- ==============================
       問題画面
  ============================== -->

  <section id="quiz-screen" class="screen">

    <div class="quiz-header">

      <button id="back-button" class="back-button">
        ← もどる
      </button>

      <div id="progress">
        1 / 10
      </div>

      <div id="score">
        ⭐ 0
      </div>

    </div>


    <div class="question-card">

      <p id="dan-label" class="dan-label">
        2のだん
      </p>


      <div id="question" class="question">
        2 × 3 = ?
      </div>


      <form id="answer-form">

        <input
          id="answer"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
          enterkeyhint="done"
          maxlength="2"
          placeholder="?"
          aria-label="こたえ"
        >

      </form>


      <div
        id="message"
        class="message"
        aria-live="polite">
      </div>


      <button
        id="next-button"
        type="button"
        class="next-button hidden">

        つぎのもんだい →

      </button>


      <div id="history-area" class="history-area">

        <p class="history-title">
          これまで
        </p>

        <div
          id="answer-history"
          class="answer-history">
        </div>

      </div>

    </div>

  </section>


  <!-- ==============================
       結果画面
  ============================== -->

  <section id="result-screen" class="screen">

    <div id="result-icon" class="result-icon">
      🎉
    </div>

    <h2>おつかれさま！</h2>


    <div id="result-score" class="result-score">
    </div>


    <p id="result-message" class="result-message">
    </p>


    <div id="mistakes-area" class="mistakes-area hidden">

      <h3>
        もういちど やってみよう！
      </h3>

      <div id="mistake-list">
      </div>


      <button
        id="retry-button"
        type="button"
        class="retry-button">

        🔥 まちがえたもんだいに ちょうせん！

      </button>

    </div>


    <button
      id="restart-button"
      type="button"
      class="restart-button">

      🏠 だんを えらぶ

    </button>

  </section>


  <!-- ==============================
       学習記録
  ============================== -->

  <section id="stats-screen" class="screen">

    <div class="stats-header">

      <button id="stats-back-button" class="back-button">
        ← もどる
      </button>

      <h2>
        📊 がくしゅうきろく
      </h2>

    </div>


    <div class="stats-card">

      <h3>
        だんごとの せいせき
      </h3>

      <div class="stat-table-header">

        <span>だん</span>

        <span>せいとうりつ</span>

        <span>ちょうせん</span>

      </div>


      <div id="dan-stats">
      </div>

    </div>


    <div class="stats-card">

      <h3>
        九九ヒートマップ
      </h3>

      <p class="stats-help">
        にがてな もんだいを みつけよう！
      </p>


      <div class="heat-legend">

        <span>
          <i class="legend-dot excellent"></i>
          80%以上
        </span>

        <span>
          <i class="legend-dot medium"></i>
          50〜79%
        </span>

        <span>
          <i class="legend-dot weak"></i>
          49%以下
        </span>

      </div>


      <div class="heatmap-wrapper">

        <div
          id="heatmap"
          class="heatmap">
        </div>

      </div>

    </div>


    <button
      id="clear-stats-button"
      type="button"
      class="clear-stats-button">

      🗑️ きろくをリセット

    </button>

  </section>

</main>


<script src="app.js"></script>

</body>
</html>
