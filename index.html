<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff6c8">
  <title>九九クエスト</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<main class="app">

  <!-- =========================
       スタート
  ========================== -->
  <section id="start-screen" class="screen active">

    <div class="title-icon">⚔️</div>

    <h1>九九クエスト</h1>

    <p class="subtitle">
      九九をつかって モンスターをたおそう！
    </p>

    <div class="dan-buttons">
      <button type="button" class="dan-button" data-dan="2">2のだん</button>
      <button type="button" class="dan-button" data-dan="3">3のだん</button>
      <button type="button" class="dan-button" data-dan="4">4のだん</button>
      <button type="button" class="dan-button" data-dan="5">5のだん</button>
      <button type="button" class="dan-button" data-dan="6">6のだん</button>
      <button type="button" class="dan-button" data-dan="7">7のだん</button>
      <button type="button" class="dan-button" data-dan="8">8のだん</button>
      <button type="button" class="dan-button" data-dan="9">9のだん</button>
    </div>

    <div class="special-buttons">
      <button type="button" id="mix-button" class="menu-button mix">
        🔀 ごちゃまぜ
      </button>

      <button type="button" id="weak-button" class="menu-button weak">
        🔥 にがてもんだい
      </button>

      <button type="button" id="stats-button" class="menu-button stats">
        📊 がくしゅうきろく
      </button>
    </div>

  </section>


  <!-- =========================
       コース選択
  ========================== -->
  <section id="mode-screen" class="screen">

    <button type="button" id="mode-back-button" class="back-button">
      ← もどる
    </button>

    <div class="mode-card">

      <h2 id="mode-title">7のだん</h2>

      <!-- 出題方法 -->
      <div id="practice-mode-area">

        <p class="choice-title">れんしゅう方法</p>

        <div class="choice-grid">

          <button
            type="button"
            id="order-button"
            class="choice-button selected">

            <span class="choice-icon">🔢</span>

            <strong>じゅんばん</strong>

            <small>
              1から9まで
            </small>

          </button>

          <button
            type="button"
            id="random-button"
            class="choice-button">

            <span class="choice-icon">🎲</span>

            <strong>ランダム</strong>

            <small>
              バラバラ10もん
            </small>

          </button>

        </div>

      </div>


      <!-- 難易度 -->
      <p class="choice-title">
        むずかしさ
      </p>

      <div class="difficulty-list">

        <button
          type="button"
          class="difficulty-button selected"
          data-difficulty="easy">

          <span>🌱</span>

          <div>
            <strong>やさしい</strong>
            <small>15びょう　❤️×5</small>
          </div>

        </button>


        <button
          type="button"
          class="difficulty-button"
          data-difficulty="normal">

          <span>⚔️</span>

          <div>
            <strong>ふつう</strong>
            <small>10びょう　❤️×3</small>
          </div>

        </button>


        <button
          type="button"
          class="difficulty-button"
          data-difficulty="hard">

          <span>🔥</span>

          <div>
            <strong>むずかしい</strong>
            <small>5びょう　❤️×2</small>
          </div>

        </button>

      </div>


      <button type="button" id="start-battle-button" class="start-battle-button">
        ⚔️ ぼうけんスタート！
      </button>

    </div>

  </section>


  <!-- =========================
       バトル
  ========================== -->
  <section id="quiz-screen" class="screen">

    <div class="quiz-header">

      <button type="button" id="back-button" class="back-button">
        ← もどる
      </button>

      <div id="progress">
        1 / 9
      </div>

      <div id="difficulty-label">
        🌱
      </div>

    </div>


    <!-- バトル -->
    <div class="battle-panel">

      <div id="hero-box" class="fighter">

        <div id="hero-character" class="character">
          🧙
        </div>

        <div class="fighter-name">
          ぼうけんしゃ
        </div>

        <div
          id="hero-lives"
          class="hero-lives">
          ❤️❤️❤️❤️❤️
        </div>

      </div>


      <div class="battle-center">
        <div id="battle-effect" class="battle-effect"></div>
      </div>


      <div id="monster-box" class="fighter">

        <div id="monster-character" class="character">
          👾
        </div>

        <div class="fighter-name">
          モンスター
        </div>

        <div class="monster-hp-text">
          HP
          <span id="monster-hp-text">9 / 9</span>
        </div>

        <div class="hp-bar">
          <div id="monster-hp-bar" class="hp-value"></div>
        </div>

      </div>

    </div>


    <!-- 問題カード -->
    <div class="question-card">

      <div class="question-top">

        <p id="dan-label" class="dan-label">
          6のだん
        </p>

        <div id="timer-text" class="timer-text">
          ⏱️ 15
        </div>

      </div>


      <div class="timer-bar">
        <div id="timer-value" class="timer-value"></div>
      </div>


      <div id="question" class="question">
        6 × 1 = ?
      </div>


      <div
        id="answer-display"
        class="answer-display empty"
        aria-live="polite"
        aria-label="こたえ">
        ?
      </div>


      <div
        id="message"
        class="message"
        aria-live="polite">
      </div>


      <button
        type="button"
        id="next-button"
        class="next-button hidden">
        つぎのもんだい →
      </button>


      <div class="history-area">

        <span class="history-title">
          これまで
        </span>

        <div
          id="answer-history"
          class="answer-history">
        </div>

      </div>

    </div>


    <!-- テンキー -->
    <div id="number-pad" class="number-pad">

      <button type="button" class="number-key" data-number="1">1</button>
      <button type="button" class="number-key" data-number="2">2</button>
      <button type="button" class="number-key" data-number="3">3</button>

      <button type="button" class="number-key" data-number="4">4</button>
      <button type="button" class="number-key" data-number="5">5</button>
      <button type="button" class="number-key" data-number="6">6</button>

      <button type="button" class="number-key" data-number="7">7</button>
      <button type="button" class="number-key" data-number="8">8</button>
      <button type="button" class="number-key" data-number="9">9</button>

      <button type="button" id="clear-key" class="control-key">
        けす
      </button>

      <button type="button" class="number-key" data-number="0">0</button>

      <button type="button" id="decide-key" class="decide-key">
        けってい
      </button>

    </div>

  </section>


  <!-- =========================
       結果
  ========================== -->
  <section id="result-screen" class="screen">

    <div id="result-icon" class="result-icon">
      🏆
    </div>

    <h2 id="result-title">
      モンスターを たおした！
    </h2>

    <div id="result-monster" class="result-monster">
      💥
    </div>

    <div id="result-score" class="result-score"></div>

    <p id="result-message" class="result-message"></p>


    <div id="mistakes-area" class="mistakes-area hidden">

      <h3>もういちど やってみよう！</h3>

      <div id="mistake-list"></div>

      <button
        type="button"
        id="retry-button"
        class="retry-button">

        🔥 まちがえたもんだいに ちょうせん！

      </button>

    </div>


    <button
      type="button"
      id="restart-button"
      class="restart-button">

      🏠 コースを えらぶ

    </button>

  </section>


  <!-- =========================
       学習記録
  ========================== -->
  <section id="stats-screen" class="screen">

    <div class="stats-header">

      <button
        type="button"
        id="stats-back-button"
        class="back-button">
        ← もどる
      </button>

      <h2>📊 がくしゅうきろく</h2>

    </div>


    <div class="stats-card">

      <h3>だんごとの せいせき</h3>

      <div class="stat-table-header">
        <span>だん</span>
        <span>せいとうりつ</span>
        <span>ちょうせん</span>
      </div>

      <div id="dan-stats"></div>

    </div>


    <div class="stats-card">

      <h3>九九ヒートマップ</h3>

      <p class="stats-help">
        にがてな もんだいを みつけよう！
      </p>

      <div class="heat-legend">

        <span>
          <i class="legend-dot excellent"></i>
          80%以上
        </span>

        <span>
          <i class="legend-dot medium"></i>
          50〜79%
        </span>

        <span>
          <i class="legend-dot weak"></i>
          49%以下
        </span>

      </div>


      <div class="heatmap-wrapper">
        <div id="heatmap" class="heatmap"></div>
      </div>

    </div>


    <button
      type="button"
      id="clear-stats-button"
      class="clear-stats-button">

      🗑️ きろくをリセット

    </button>

  </section>

</main>

<script src="app.js"></script>

</body>
</html>
